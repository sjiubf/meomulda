<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>머물다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Pretendard:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#FAF8F5; --panel:#FFFFFF; --panel2:#F3EFEA; --line:#E6E0D7;
    --text:#3D352E; --sub:#8A7F6B; --accent:#4A6B5D; --accent-soft:#E1EBE6; --danger:#E08A68;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background-size:cover;background-position:center;background-attachment:fixed;transition:background-color .3s,color .3s;}
  h1,h2,h3,.serif{font-family:"Noto Serif KR",serif}
  .swatch{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);cursor:pointer;display:inline-block}
  .swatch.selected{outline:2px solid var(--accent);outline-offset:2px}
  .settingsub{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  .settingsub button{background:none;border:1px solid var(--line);color:var(--sub);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:13px;transition:all .15s}
  .settingsub button.active{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);font-weight:600}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 24px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.7);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10}
  header h1{font-size:21px;margin:0;font-weight:700;letter-spacing:0;color:var(--accent);white-space:nowrap;flex-shrink:0}
  nav{display:flex;gap:4px;flex-wrap:wrap;flex:1;justify-content:flex-end}
  nav button{background:none;border:1px solid transparent;color:var(--sub);padding:9px 14px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500;transition:all .15s;white-space:nowrap}
  nav button.active{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft);font-weight:600}
  #settingsGear{background:none;border:1px solid var(--line);color:var(--text);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  #settingsGear:hover{background:var(--panel2)}
  #settingsGear.active{border-color:var(--accent);background:var(--accent-soft)}
  @media (max-width: 600px){ .navlabel{display:none} nav button{padding:9px 11px} }
  .modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modalOverlay.open{display:flex}
  .modalPanel{background:var(--panel);border-radius:18px;padding:22px;max-width:420px;width:100%;max-height:80vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.25)}
  .modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  main{max-width:640px;margin:0 auto;padding:24px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 2px 14px rgba(61,53,46,.05)}
  input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 14px;font-size:14px;font-family:inherit;transition:border-color .15s}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);background:var(--panel)}
  textarea{min-height:120px;resize:vertical;line-height:1.6}
  label{font-size:13px;color:var(--sub);display:block;margin:12px 0 6px;font-weight:500}
  button.btn{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:11px 18px;font-weight:600;cursor:pointer;font-size:14px;transition:all .15s;box-shadow:0 2px 8px rgba(74,107,93,.25)}
  button.btn:hover{background:#3A5548}
  button.btn.ghost{background:none;border:1px solid var(--line);color:var(--text);box-shadow:none}
  button.btn.ghost:hover{background:var(--panel2)}
  button.btn.small{padding:7px 12px;font-size:13px;border-radius:9px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
  .muted{color:var(--sub);font-size:13px}
  .record{border-bottom:1px solid var(--line);padding:14px 0}
  .record:last-child{border-bottom:none}
  .tag{display:inline-block;font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin-right:6px;background:var(--panel2)}
  .tag.saved{color:#4A6B5D;border-color:#C7DACF;background:#EEF4F0}
  .tag.draft{color:#B9793F;border-color:#EAD3B0;background:#FBF1E3}
  .tagtoggle{display:inline-block;font-size:11px;border-radius:999px;padding:4px 12px;margin-right:6px;margin-top:6px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--sub)}
  .tagtoggle.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .empty{color:var(--sub);text-align:center;padding:40px 0;font-size:14px}
  a{color:var(--accent)}
  .iconbtn{background:none;border:none;cursor:pointer;font-size:15px;padding:5px 8px;border-radius:8px;transition:background .15s}
  .iconbtn:hover{background:var(--panel2)}
  .actionlink{color:var(--sub);font-size:12px;cursor:pointer;background:none;border:none;padding:2px 4px}
  .actionlink:hover{color:var(--accent);text-decoration:underline}
  .actionlink.danger:hover{color:var(--danger)}
  .cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:11px 20px;border-radius:12px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .dropzone{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;cursor:pointer;transition:all .15s;background:var(--panel2)}
  .dropzone:hover{background:var(--accent-soft);border-color:var(--accent)}
  .dropzone input{display:none}
</style>
</head>
<body>

<header>
  <h1 class="serif">머물다</h1>
  <nav id="nav" style="display:none">
    <button data-view="moment"><span class="navicon">🌿</span><span class="navlabel"> 오늘의 멈춤</span></button>
    <button data-view="write"><span class="navicon">✍️</span><span class="navlabel"> 기록하기</span></button>
    <button data-view="records"><span class="navicon">📖</span><span class="navlabel"> 기록보기</span></button>
  </nav>
  <button id="settingsGear" style="display:none" title="설정">⚙️</button>
</header>

<main id="app"></main>

<script>
// ====== 설정: 발급받은 값으로 교체 ======
const SUPABASE_URL = "https://rmcrugtzsiflgsmflcab.supabase.co";
const SUPABASE_KEY = "sb_publishable_LMpQN4WwRfRvlNwgVQbd5w_GItY66bj";
// =======================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let state = { user: null, view: "moment", relationships: [], records: [], profile: null, folders: [], quotes: [] };
let settingsTab = "profile"; // profile | system | info
const DEFAULT_FOLDERS = ["나의 삶", "우리의 이야기", "기억 / 유산"];

const THEMES = {
  warm: { label: "따뜻한 종이", bg:"#FAF8F5", panel:"#FFFFFF", panel2:"#F3EFEA", line:"#E6E0D7", text:"#3D352E", sub:"#8A7F6B", accent:"#4A6B5D", accentSoft:"#E1EBE6", danger:"#E08A68" },
  soft: { label: "부드러운 그레이", bg:"#EDEBE6", panel:"#F8F7F4", panel2:"#E9E5DD", line:"#D9D5CC", text:"#33312C", sub:"#84806F", accent:"#5B7A8C", accentSoft:"#DCE6EB", danger:"#B85C4A" },
  dark: { label: "차분한 다크", bg:"#2A2420", panel:"#352E28", panel2:"#3D352D", line:"#463D34", text:"#EFE7DA", sub:"#B3A594", accent:"#7FA08E", accentSoft:"#3D4A44", danger:"#D97B63" },
};
const FONT_SIZES = { sm: "14px", md: "16px", lg: "18px" };

function applyTheme(themeKey, textColorOverride){
  const t = THEMES[themeKey] || THEMES.warm;
  const root = document.documentElement.style;
  root.setProperty("--bg", t.bg);
  root.setProperty("--panel", t.panel);
  root.setProperty("--panel2", t.panel2);
  root.setProperty("--line", t.line);
  root.setProperty("--text", textColorOverride || t.text);
  root.setProperty("--sub", t.sub);
  root.setProperty("--accent", t.accent);
  root.setProperty("--accent-soft", t.accentSoft);
  root.setProperty("--danger", t.danger);
}

function applyFontSize(sizeKey){
  document.documentElement.style.fontSize = FONT_SIZES[sizeKey] || FONT_SIZES.md;
}

function applyBackground(url){
  if (url){
    document.body.style.backgroundImage = `linear-gradient(rgba(0,0,0,.18), rgba(0,0,0,.18)), url('${url}')`;
  } else {
    document.body.style.backgroundImage = "none";
  }
}

async function applyProfileSettings(profile){
  if (!profile) return;
  applyTheme(profile.theme, profile.text_color);
  applyFontSize(profile.font_size);
  applyNavIcons(profile.nav_icons);
  if (profile.background_image_path){
    const { data } = await sb.storage.from("media").createSignedUrl(profile.background_image_path, 3600);
    applyBackground(data?.signedUrl || null);
  } else if (profile.background_image_url){
    applyBackground(profile.background_image_url);
  } else {
    applyBackground(null);
  }
}

function applyNavIcons(icons){
  const ic = icons || {};
  const map = { moment: ic.moment || "🌿", write: ic.write || "✍️", records: ic.records || "📖" };
  document.querySelectorAll("nav button[data-view]").forEach(btn=>{
    const iconEl = btn.querySelector(".navicon");
    if (iconEl) iconEl.textContent = map[btn.dataset.view];
  });
}

async function loadProfile(){
  const { data, error } = await sb.from("profiles").select("*").eq("id", state.user.id).single();
  if (error){ toast("설정 불러오기 실패: " + error.message); return; }
  state.profile = data;
  await applyProfileSettings(data);
}

// ---------- 폴더 (기본 시딩 + 로딩) ----------
async function ensureDefaultFolders(){
  const { data } = await sb.from("folders").select("name").eq("owner_id", state.user.id).eq("is_default", true);
  const existing = new Set((data||[]).map(f=>f.name));
  const missing = DEFAULT_FOLDERS.filter(n=>!existing.has(n));
  if (missing.length){
    await sb.from("folders").insert(missing.map((name,i)=>({owner_id: state.user.id, name, is_default: true, sort_order: i})));
  }
}

async function loadFolders(){
  const { data, error } = await sb.from("folders").select("*").eq("owner_id", state.user.id).order("sort_order").order("created_at");
  if (error){ toast("폴더 불러오기 실패: " + error.message); return; }
  state.folders = data || [];
}

function toast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

// ---------- 인증 ----------
async function ensureProfile(user){
  await sb.from("profiles").upsert({
    id: user.id,
    is_anonymous: user.is_anonymous ?? (user.app_metadata?.provider === "anonymous"),
  }, { onConflict: "id" });
}

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user){
    state.user = session.user;
    await ensureProfile(state.user);
    await loadProfile();
    await ensureDefaultFolders();
    document.getElementById("nav").style.display = "flex";
    document.getElementById("settingsGear").style.display = "flex";
    render();
  } else {
    renderAuth();
  }
}

sb.auth.onAuthStateChange((_event, session) => {
  if (session?.user && !state.user){
    state.user = session.user;
    ensureProfile(state.user).then(loadProfile).then(ensureDefaultFolders).then(()=>{
      document.getElementById("nav").style.display = "flex";
      document.getElementById("settingsGear").style.display = "flex";
      render();
    });
  }
});

async function signInGuest(){
  const { error } = await sb.auth.signInAnonymously();
  if (error) return toast("게스트 로그인 실패: " + error.message);
}

async function signUpEmail(email, pw){
  const { error } = await sb.auth.signUp({ email, password: pw });
  if (error) return toast("가입 실패: " + error.message);
  toast("가입 확인 이메일을 보냈습니다. 확인 후 로그인해주세요.");
}

async function signInEmail(email, pw){
  const { error } = await sb.auth.signInWithPassword({ email, password: pw });
  if (error) return toast("로그인 실패: " + error.message);
}

async function signOut(){
  const isGuest = state.user?.is_anonymous ?? (state.user?.app_metadata?.provider === "anonymous");
  if (isGuest){
    const ok = confirm(
      "게스트 계정입니다. 지금 로그아웃하면 지금까지 쓴 기록으로 다시 돌아올 방법이 없습니다.\n" +
      "계속 쓰시려면 '설정 > 개인 프로필'에서 이메일로 먼저 전환해주세요.\n\n" +
      "그래도 로그아웃하시겠습니까?"
    );
    if (!ok) return;
  }
  await sb.auth.signOut();
  state.user = null;
  document.getElementById("nav").style.display = "none";
  document.getElementById("settingsGear").style.display = "none";
  renderAuth();
}

function renderAuth(){
  document.getElementById("app").innerHTML = `
    <div class="panel">
      <p class="muted">로그인 없이 게스트로 바로 시작할 수 있습니다. 기록을 다른 사람과 공유하려면 이메일 계정이 필요합니다.</p>
      <button class="btn" id="guestBtn">게스트로 시작하기</button>
      <hr style="border-color:var(--line);margin:20px 0">
      <label>이메일</label>
      <input id="authEmail" type="email" placeholder="you@example.com">
      <label>비밀번호</label>
      <input id="authPw" type="password" placeholder="********">
      <label style="display:flex;align-items:flex-start;gap:8px;margin-top:14px;cursor:pointer">
        <input type="checkbox" id="minorConsent" style="width:auto;margin-top:3px">
        <span class="muted">본인은 만 14세 이상이거나, 만 14세 미만인 경우 법정대리인(보호자)의 동의를 받았습니다. (이메일로 회원가입 시 필수)</span>
      </label>
      <div class="row">
        <button class="btn ghost" id="loginBtn">로그인</button>
        <button class="btn ghost" id="signupBtn">회원가입</button>
      </div>
    </div>
  `;
  document.getElementById("guestBtn").onclick = signInGuest;
  document.getElementById("loginBtn").onclick = () => signInEmail(authEmail.value, authPw.value);
  document.getElementById("signupBtn").onclick = () => {
    if (!document.getElementById("minorConsent").checked){
      return toast("만 14세 이상 확인(또는 보호자 동의) 체크가 필요합니다.");
    }
    signUpEmail(authEmail.value, authPw.value);
  };
}

// ---------- 네비게이션 ----------
document.getElementById("nav").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-view]");
  if (!btn) return;
  state.view = btn.dataset.view;
  render();
});
document.getElementById("settingsGear").addEventListener("click", () => {
  state.view = "settings";
  render();
});

function markActiveNav(){
  document.querySelectorAll("nav button").forEach(b=>{
    b.classList.toggle("active", b.dataset.view === state.view);
  });
  document.getElementById("settingsGear").classList.toggle("active", state.view === "settings");
}

async function render(){
  markActiveNav();
  const app = document.getElementById("app");
  if (state.view === "moment") return renderMoment();
  if (state.view === "write") return renderWrite();
  if (state.view === "records") return renderRecords();
  if (state.view === "settings") return renderSettings();
}

// ---------- 오늘의 멈춤 (나의 명언) — 자동저장 ----------
let momentDraftId = null;
let momentTimer = null;

function renderMoment(){
  momentDraftId = null;
  document.getElementById("app").innerHTML = `
    <div class="panel">
      <p class="muted">지금 떠오르는 짧은 생각을 적어보세요. 이 기록은 완전히 비공개이며, 소중한 존재를 연결하거나 공유할 수 없습니다.</p>
      <textarea id="momentBody" placeholder="짧아도 괜찮습니다. 한 문장도 삶의 기록입니다."></textarea>
      <div class="muted" id="momentStatus" style="margin-top:6px"></div>
      <div class="row">
        <button class="btn ghost" id="momentNew">새 글쓰기</button>
        <button class="btn" id="momentSave">기록하기</button>
      </div>
      <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--line)">
        <button class="btn ghost small" id="showQuote">오늘의 명언 보기</button>
        <div id="quoteBox" style="display:none;margin-top:12px">
          <div id="quoteText" style="font-style:italic"></div>
          <div id="quoteAuthor" class="muted" style="margin-top:4px"></div>
          <button class="btn ghost small" id="anotherQuote" style="margin-top:10px">다른 명언</button>
        </div>
      </div>
    </div>
  `;
  const ta = document.getElementById("momentBody");
  ta.addEventListener("input", () => scheduleAutosave(momentTimer, autosaveMoment, (t)=>momentTimer=t));
  document.getElementById("momentNew").onclick = () => confirmNewEntry(
    () => document.getElementById("momentBody").value.trim(),
    async () => { await autosaveMoment(); renderMoment(); },
    () => renderMoment()
  );
  document.getElementById("momentSave").onclick = () => finalizeMoment();
  document.getElementById("showQuote").onclick = async () => {
    if (!state.quotes.length) await loadQuotes();
    document.getElementById("quoteBox").style.display = "block";
    showRandomQuote();
  };
  document.getElementById("anotherQuote").onclick = showRandomQuote;
}

function showRandomQuote(){
  if (!state.quotes.length){
    document.getElementById("quoteText").textContent = "아직 업로드된 명언이 없습니다.";
    document.getElementById("quoteAuthor").textContent = "설정 > 명언 관리에서 업로드해보세요.";
    return;
  }
  const q = state.quotes[Math.floor(Math.random() * state.quotes.length)];
  document.getElementById("quoteText").textContent = "“" + q.text + "”";
  document.getElementById("quoteAuthor").textContent = "— " + (q.author || "작자 미상");
}

function confirmNewEntry(getBody, onSaveThenNew, onDiscardNew){
  const body = getBody();
  if (!body){ onDiscardNew(); return; }
  if (confirm("지금 쓰던 내용을 저장할까요?\n확인: 저장 후 새 글쓰기 / 취소: 저장하지 않고 새 글쓰기")){
    onSaveThenNew();
  } else {
    onDiscardNew();
  }
}

function scheduleAutosave(timerVar, fn, setTimerVar){
  clearTimeout(timerVar);
  const sec = (state.profile?.autosave_interval_sec) || 5;
  setTimerVar(setTimeout(fn, sec * 1000));
}

function setStatusText(elId, text){
  const el = document.getElementById(elId);
  if (el) el.textContent = text;
}

async function autosaveMoment(){
  const body = document.getElementById("momentBody")?.value.trim();
  if (!body) return;
  if (momentDraftId){
    const { error } = await sb.from("records").update({ body, updated_at: new Date().toISOString() }).eq("id", momentDraftId);
    if (error) return;
  } else {
    const { data, error } = await sb.from("records").insert({ owner_id: state.user.id, kind: "moment", body, status: "draft" }).select().single();
    if (error) return;
    momentDraftId = data.id;
  }
  setStatusText("momentStatus", "자동저장됨 · " + new Date().toLocaleTimeString("ko-KR", { hour:"2-digit", minute:"2-digit" }));
}

async function finalizeMoment(){
  const body = document.getElementById("momentBody").value.trim();
  if (!body) return toast("내용을 입력해주세요.");
  clearTimeout(momentTimer);
  if (momentDraftId){
    const { error } = await sb.from("records").update({ body, status: "saved", updated_at: new Date().toISOString() }).eq("id", momentDraftId);
    if (error) return toast("저장 실패: " + error.message);
  } else {
    const { data, error } = await sb.from("records").insert({ owner_id: state.user.id, kind: "moment", body, status: "saved" }).select().single();
    if (error) return toast("저장 실패: " + error.message);
    momentDraftId = data.id;
  }
  toast("기록했습니다.");
  setStatusText("momentStatus", "저장 완료 · 계속 이어쓰거나 '새 글쓰기'를 눌러 새로 시작하세요.");
}

// ---------- 기록하기 (나의 기록) — 자동저장 ----------
let writeDraftId = null;
let writeTimer = null;

async function renderWrite(){
  writeDraftId = null;
  if (!state.relationships.length) await loadRelationships();
  document.getElementById("app").innerHTML = `
    <div class="panel">

  );

async function autosaveWrite(){
  const title = document.getElementById("wTitle")?.value.trim() || null;
  const body = document.getElementById("wBody")?.value.trim();
  if (!body) return;
  if (writeDraftId){
    const { error } = await sb.from("records").update({ title, body, updated_at: new Date().toISOString() }).eq("id", writeDraftId);
    if (error) return;
  } else {
    const { data, error } = await sb.from("records").insert({ owner_id: state.user.id, kind: "record", title, body, status: "draft" }).select().single();
    if (error) return;
    writeDraftId = data.id;
  }
  setStatusText("writeStatus", "자동저장됨 · " + new Date().toLocaleTimeString("ko-KR", { hour:"2-digit", minute:"2-digit" }));
}

async function finalizeWrite(){
  const title = document.getElementById("wTitle").value.trim() || null;
  const body = document.getElementById("wBody").value.trim();
  const personId = document.getElementById("wPerson").value || null;
  const file = document.getElementById("wFile").files[0];
  if (!body) return toast("내용을 입력해주세요.");
  clearTimeout(writeTimer);

  let recId = writeDraftId;
  if (recId){
    const { error } = await sb.from("records").update({ title, body, status: "saved", updated_at: new Date().toISOString() }).eq("id", recId);
    if (error) return toast("저장 실패: " + error.message);
  } else {
    const { data, error } = await sb.from("records").insert({ owner_id: state.user.id, kind: "record", title, body, status: "saved" }).select().single();
    if (error) return toast("저장 실패: " + error.message);
    recId = data.id;
    writeDraftId = recId;
  }

  await sb.from("record_relationships").delete().eq("record_id", recId);
  if (personId){
    await sb.from("record_relationships").insert({ record_id: recId, relationship_id: personId });
  }

  if (file){
    const uploadFile = await compressImage(file);
    const path = `${state.user.id}/${recId}/${uploadFile.name}`;
    const { error: upErr } = await sb.storage.from("media").upload(path, uploadFile, { upsert: true });
    if (upErr){
      toast("파일 업로드 실패: " + upErr.message);
    } else {
      await sb.from("media").insert({ record_id: recId, media_type: uploadFile.type || "file", storage_path: path });
    }
  }

  toast("저장했습니다.");
  setStatusText("writeStatus", "저장 완료 · 계속 이어쓰거나 '새 글쓰기'를 눌러 새로 시작하세요.");
}

let recordsFilter = "all"; // all | draft | saved
let folderFilter = null; // folder id | null
let personFilterView = null; // relationship id | null
let openRecordId = null;
let continueUnlocked = false;
let currentPage = 1;

function buildPageNumbers(current, total){
  if (total <= 7) return Array.from({length: total}, (_, i) => i + 1);
  const nums = new Set([1, total, current, current - 1, current + 1]);
  const sorted = [...nums].filter(n => n >= 1 && n <= total).sort((a,b)=>a-b);
  const out = [];
  let prev = null;
  for (const n of sorted){
    if (prev !== null && n - prev > 1) out.push("…");
    out.push(n);
    prev = n;
  }
  return out;
}

function renderPager(current, total){
  const pager = document.getElementById("pager");
  if (!pager) return;
  const nums = buildPageNumbers(current, total);
  pager.innerHTML = `
    <button class="btn ghost small" data-page="${current-1}" ${current<=1?'disabled':''}>이전</button>
    ${nums.map(n => n === "…"
      ? `<span class="muted" style="padding:0 4px">…</span>`
      : `<button class="btn ${n===current?'':'ghost'} small" data-page="${n}">${n}</button>`
    ).join("")}
    <button class="btn ghost small" data-page="${current+1}" ${current>=total?'disabled':''}>다음</button>
  `;
  pager.querySelectorAll("[data-page]").forEach(btn=>{
    btn.onclick = () => { currentPage = parseInt(btn.dataset.page, 10); renderRecords(); };
  });
}

async function loadRecords(){
  const { data, error } = await sb.from("records")
    .select("*, record_relationships(relationship_id, relationships(person_name)), record_shares(id, share_method, share_token), media(id, storage_path, media_type), record_folders(folder_id)")
    .is("parent_record_id", null)
    .order("created_at", { ascending: false });
  if (error){ toast("불러오기 실패: " + error.message); return; }
  state.records = data || [];
}

async function renderRecords(){
  await loadRelationships();
  await loadFolders();
  await loadRecords();
  const app = document.getElementById("app");
  let filtered = state.records.filter(r => recordsFilter === "all" || r.status === recordsFilter);
  if (folderFilter){
    filtered = filtered.filter(r => (r.record_folders||[]).some(f => f.folder_id === folderFilter));
  }
  if (personFilterView){
    filtered = filtered.filter(r => (r.record_relationships||[]).some(x => x.relationship_id === personFilterView));
  }

  const pageSize = state.profile?.records_per_page || 10;
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;
  const pageItems = filtered.slice((currentPage - 1) * pageSize, currentPage * pageSize);

  const activeFilterCount = (recordsFilter!=='all'?1:0) + (personFilterView?1:0) + (folderFilter?1:0);

  app.innerHTML = `
    <div class="panel" id="recList" style="margin-top:0">
      ${pageItems.length ? "" : `<div class="empty">해당하는 기록이 없습니다.</div>`}
    </div>

    <div class="row" style="justify-content:center;margin-top:14px">
      <button class="btn ghost small" id="filterOpenBtn">🔎 필터${activeFilterCount ? ` (${activeFilterCount})` : ""}</button>
    </div>
    <div class="modalOverlay" id="filterModal">
      <div class="modalPanel">
        <div class="modalHead">
          <strong>필터</strong>
          <button class="iconbtn" id="filterModalClose">✕</button>
        </div>
        <label>상태</label>
        <select id="filterStatus">
          <option value="all" ${recordsFilter==='all'?'selected':''}>전체 상태</option>
          <option value="draft" ${recordsFilter==='draft'?'selected':''}>임시저장</option>
          <option value="saved" ${recordsFilter==='saved'?'selected':''}>저장됨</option>
        </select>
        ${state.relationships.length ? `
        <label>소중한 존재</label>
        <select id="filterPerson">
          <option value="">전체 소중한 존재</option>
          ${state.relationships.map(p=>`<option value="${p.id}" ${personFilterView===p.id?'selected':''}>${p.person_name}</option>`).join("")}
        </select>` : ""}
        <label>글모음</label>
        <select id="filterFolder">
          <option value="">전체 글모음</option>
          ${state.folders.map(f=>`<option value="${f.id}" ${folderFilter===f.id?'selected':''}>${f.name}</option>`).join("")}
        </select>
        <div class="row">
          <button class="btn small" id="filterApply">적용</button>
          <button class="btn ghost small" id="filterReset">초기화</button>
        </div>

  document.getElementById("filterModalClose").onclick = () => document.getElementById("filterModal").classList.remove("open");
  document.getElementById("filterApply").onclick = () => {
    recordsFilter = document.getElementById("filterStatus").value;
    const personSel = document.getElementById("filterPerson");

    folderFilter = document.getElementById("filterFolder").value || null;

    renderRecords();

    renderRecords();

  list.querySelectorAll("[data-open]").forEach(btn=>{

  });
  list.querySelectorAll("[data-continue]").forEach(btn=>{

async function saveAttachment(recordId, existingMediaId){
  const rawFile = document.getElementById("rFile-" + recordId).files[0];
  if (!rawFile) return toast("파일을 선택해주세요.");
  const file = await compressImage(rawFile);
  const path = `${state.user.id}/${recordId}/${file.name}`;
  const { error: upErr } = await sb.storage.from("media").upload(path, file, { upsert: true });
  if (upErr) return toast("업로드 실패: " + upErr.message);
  if (existingMediaId){
    const { error } = await sb.from("media").update({ storage_path: path, media_type: file.type || "file" }).eq("id", existingMediaId);
    if (error) return toast("저장 실패: " + error.message);
  } else {
    const { error } = await sb.from("media").insert({ record_id: recordId, storage_path: path, media_type: file.type || "file" });
    if (error) return toast("저장 실패: " + error.message);
  }
  toast("첨부파일을 저장했습니다.");
  renderRecords();
}

async function deleteAttachment(recordId, mediaId){
  if (!confirm("첨부파일을 삭제하시겠습니까?")) return;
  const rec = state.records.find(r => r.id === recordId);
  const m = (rec?.media || [])[0];
  if (m){
    await sb.storage.from("media").remove([m.storage_path]).catch(()=>{});
  }
  const { error } = await sb.from("media").delete().eq("id", mediaId);
  if (error) return toast("삭제 실패: " + error.message);
  toast("첨부파일을 삭제했습니다.");
  renderRecords();
}

async function savePersonLink(recordId){
  const personId = document.getElementById("rPerson-" + recordId).value || null;
  await sb.from("record_relationships").delete().eq("record_id", recordId);
  if (personId){
    const { error } = await sb.from("record_relationships").insert({ record_id: recordId, relationship_id: personId });
    if (error) return toast("연결 실패: " + error.message);
  }
  toast("소중한 존재를 저장했습니다.");
  renderRecords();
}

async function toggleRecordFolder(recordId, folderId, checked, tagEl){
  if (checked){
    const { error } = await sb.from("record_folders").insert({ record_id: recordId, folder_id: folderId });
    if (error) return toast("연결 실패: " + error.message);
  } else {
    const { error } = await sb.from("record_folders").delete().eq("record_id", recordId).eq("folder_id", folderId);
    if (error) return toast("해제 실패: " + error.message);
  }
  const rec = state.records.find(r => r.id === recordId);
  if (rec){
    rec.record_folders = rec.record_folders || [];
    if (checked){
      if (!rec.record_folders.some(f=>f.folder_id===folderId)) rec.record_folders.push({ folder_id: folderId });
    } else {
      rec.record_folders = rec.record_folders.filter(f=>f.folder_id!==folderId);
    }
  }
  if (tagEl) tagEl.classList.toggle("on", checked);
}

          ${media ? `
            <div class="muted">현재: <a id="media-${r.id}" href="#" target="_blank">${media.storage_path.split("/").pop()}</a>
              <button class="actionlink danger" data-delmedia="${r.id}" data-mediaid="${media.id}">[삭제]</button>
            </div>
          ` : `<div class="muted">첨부파일 없음</div>`}

      ${media ? `<span class="tag">첨부있음</span>` : ""}
      <div style="margin-top:8px;font-weight:600;cursor:pointer" data-open="${r.id}">${r.title || (r.kind === "moment" ? "(오늘의 멈춤)" : "제목 없는 기록")}</div>
      <div class="muted" style="margin-top:4px;white-space:pre-wrap;cursor:pointer" data-open="${r.id}">${r.body}</div>

function startContinue(id){
  continueUnlocked = true;
  const ta = document.getElementById("edit-body-" + id);
  if (!ta) return;
  ta.readOnly = false;
  ta.style.background = "";
  ta.style.color = "";
  const now = new Date();
  const pad = n => String(n).padStart(2, "0");
  const stamp = `${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  ta.value = ta.value + `\n\n--> 이어쓰기 ${stamp}\n`;

// ---------- PDF 생성 (화면 캡처 방식 — 한글 폰트 임베드 문제 회피) ----------
// ---------- 이미지 자동 압축 (업로드 전, 브라우저 안에서만 처리) ----------
function compressImage(file, maxDim, quality){
  maxDim = maxDim || 1600;
  quality = quality || 0.82;
  return new Promise((resolve) => {
    if (!file.type || !file.type.startsWith("image/")){ resolve(file); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim){
        const ratio = Math.min(maxDim / width, maxDim / height);
        width = Math.round(width * ratio);
        height = Math.round(height * ratio);
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob) => {
        URL.revokeObjectURL(url);
        if (!blob){ resolve(file); return; }
        const newName = file.name.replace(/\.[^.]+$/, "") + ".jpg";
        resolve(new File([blob], newName, { type: "image/jpeg" }));
      }, "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

async function imageToDataUrl(storagePath){
  const { data, error } = await sb.storage.from("media").createSignedUrl(storagePath, 300);
  if (error) return null;
  const res = await fetch(data.signedUrl);
  const blob = await res.blob();
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(blob);
  });
}

function loadImageSize(dataUrl){
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}

async function generateBookPdf(book, sections){
  toast("PDF를 만들고 있습니다... (사진이 많으면 시간이 걸릴 수 있어요)");

  // 페이지 치수 (px, 96dpi 기준 A4)
  const PAGE_W = 794, PAGE_H = 1123;
  const MARGIN_MAP = { narrow: 40, normal: 66, wide: 93 };
  const MARGIN = MARGIN_MAP[book.margin_size] || 66;
  const CONTENT_H = PAGE_H - MARGIN * 2 - 30; // 하단 페이지번호 공간 확보
  const MAX_IMG_H = 320;

  let bgDataUrl = null;
  if (book.background_image_path){
    bgDataUrl = await imageToDataUrl(book.background_image_path);
  }

  // 섹션별 콘텐츠(HTML 블록) 구성 + 이미지 사전 로딩
  const sectionBlocks = [];
  for (const s of sections){
    const records = (s.book_section_records || []).sort((a,b)=>a.sort_order-b.sort_order);
    const items = [];
    for (const sr of records){
      const rec = sr.records;
      if (!rec) continue;
      const media = (rec.media || [])[0];
      let imgData = null, imgSize = null;
      if (media && media.media_type && media.media_type.startsWith("image/")){
        imgData = await imageToDataUrl(media.storage_path);
        if (imgData) imgSize = await loadImageSize(imgData);
      }
      items.push({ title: rec.title || "(제목 없음)", body: rec.body || "", imgData, imgSize });
    }
    sectionBlocks.push({ title: s.title, items });
  }

  // 측정용 숨은 컨테이너 (실제 DOM에 붙여서 브라우저가 레이아웃을 계산하게 함)
  const measurer = document.createElement("div");
  measurer.style.cssText = `position:fixed;left:-9999px;top:0;width:${PAGE_W - MARGIN*2}px;font-family:inherit;font-size:14px;line-height:1.6;color:#222`;
  document.body.appendChild(measurer);

  function blockHtml(kind, data){
    if (kind === "sectionTitle") return `<div style="font-size:18px;font-weight:bold;margin:0 0 14px">${escapeHtml(data)}</div>`;
    if (kind === "recordTitle") return `<div style="font-size:15px;font-weight:bold;margin:0 0 4px">${escapeHtml(data)}</div>`;
    if (kind === "recordBody") return `<div style="white-space:pre-wrap;margin:0 0 10px">${escapeHtml(data)}</div>`;
    if (kind === "image") return `<img src="${data.imgData}" style="display:block;max-width:100%;max-height:${MAX_IMG_H}px;margin:0 0 14px;border-radius:4px">`;
    return "";
  }
  function escapeHtml(s){
    return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function measure(html){
    measurer.innerHTML = html;
    return measurer.getBoundingClientRect().height;
  }

  // 블록 목록 만들기 (섹션 경계 표시 포함)
  const blocks = []; // {sectionIndex, html, height}
  sectionBlocks.forEach((sec, si) => {
    blocks.push({ sectionIndex: si, isSectionStart: true, html: blockHtml("sectionTitle", sec.title), height: measure(blockHtml("sectionTitle", sec.title)) });
    sec.items.forEach(item => {
      blocks.push({ sectionIndex: si, html: blockHtml("recordTitle", item.title), height: measure(blockHtml("recordTitle", item.title)) });
      blocks.push({ sectionIndex: si, html: blockHtml("recordBody", item.body), height: measure(blockHtml("recordBody", item.body)) });
      if (item.imgData && item.imgSize){
        const ratio = Math.min((PAGE_W - MARGIN*2) / item.imgSize.w, MAX_IMG_H / item.imgSize.h, 1);
        const h = item.imgSize.h * ratio + 14;
        blocks.push({ sectionIndex: si, html: blockHtml("image", item), height: h });
      }
    });
  });
  document.body.removeChild(measurer);

  // 페이지 분배 (섹션은 항상 새 페이지에서 시작)
  const CONTENT_START_PAGE = 3; // 1=표지, 2=목차
  const pages = []; // 각 원소: 그 페이지에 들어갈 blocks 배열
  let currentPageBlocks = [], currentH = 0, curSection = -1;
  const sectionStartPages = [];
  function pushPage(){ if (currentPageBlocks.length){ pages.push(currentPageBlocks); } currentPageBlocks = []; currentH = 0; }
  blocks.forEach(b => {
    if (b.isSectionStart){
      if (currentPageBlocks.length) pushPage();
      sectionStartPages[b.sectionIndex] = CONTENT_START_PAGE + pages.length;
    } else if (currentH + b.height > CONTENT_H){
      pushPage();
    }
    currentPageBlocks.push(b);
    currentH += b.height;
  });
  pushPage();
  if (!pages.length) pages.push([]);

  // 실제 페이지 DOM 만들기
  function makePageDiv(innerHtml, pageNum){
    const div = document.createElement("div");
    div.style.cssText = `position:fixed;left:-9999px;top:0;width:${PAGE_W}px;height:${PAGE_H}px;background:#fff;font-family:inherit;box-sizing:border-box;padding:${MARGIN}px;overflow:hidden`;
    if (bgDataUrl) div.style.cssText += `;background-image:url(${bgDataUrl});background-size:cover;background-position:center`;
    div.innerHTML = `<div style="width:100%;height:100%;position:relative">${innerHtml}${pageNum ? `<div style="position:absolute;bottom:-${MARGIN-10}px;left:0;right:0;text-align:center;font-size:11px;color:#888">${pageNum}</div>` : ""}</div>`;
    document.body.appendChild(div);
    return div;
  }

  async function captureAndRemove(div){
    const canvas = await html2canvas(div, { width: PAGE_W, height: PAGE_H, scale: 2, useCORS: true });
    document.body.removeChild(div);
    return canvas.toDataURL("image/jpeg", 0.92);
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "px", format: [PAGE_W, PAGE_H] });

  // 표지
  const coverHtml = `<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
    <div style="font-size:30px;font-weight:bold;margin-bottom:14px">${escapeHtml(book.title)}</div>
    <div style="font-size:14px;color:#888">${new Date().toLocaleDateString("ko-KR")}</div>
  </div>`;
  const coverImg = await captureAndRemove(makePageDiv(coverHtml, null));
  doc.addImage(coverImg, "JPEG", 0, 0, PAGE_W, PAGE_H);

  // 목차
  const tocRows = sectionBlocks.map((sec, i) => `
    <div style="display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid #eee">
      <span>${escapeHtml(sec.title)}</span><span>${sectionStartPages[i] || ""}</span>
    </div>`).join("");
  const tocHtml = `<div style="font-size:20px;font-weight:bold;margin-bottom:20px">목차</div>${tocRows}`;
  const tocImg = await captureAndRemove(makePageDiv(tocHtml, null));
  doc.addPage([PAGE_W, PAGE_H]);
  doc.addImage(tocImg, "JPEG", 0, 0, PAGE_W, PAGE_H);

  // 본문
  for (let i = 0; i < pages.length; i++){
    const pageHtml = pages[i].map(b => b.html).join("");
    const pageNum = CONTENT_START_PAGE + i;
    const pageImg = await captureAndRemove(makePageDiv(pageHtml, pageNum));
    doc.addPage([PAGE_W, PAGE_H]);
    doc.addImage(pageImg, "JPEG", 0, 0, PAGE_W, PAGE_H);
  }

  const blob = doc.output("blob");
  const url = URL.createObjectURL(blob);
  window.open(url, "_blank");
}

function currentPickerFilters(){
  return {
    kind: document.getElementById("pfKind")?.value || "",
    folder: document.getElementById("pfFolder")?.value || "",
    person: document.getElementById("pfPerson")?.value || "",
    from: document.getElementById("pfFrom")?.value || "",
    to: document.getElementById("pfTo")?.value || "",
    keyword: document.getElementById("pfKeyword")?.value.trim() || "",
  };
}

function filterPickerRecords(savedRecords, excludeIds, filters){
  return savedRecords.filter(r => {
    if (excludeIds.has(r.id)) return false;
    if (filters.kind && r.kind !== filters.kind) return false;
    if (filters.folder && !(r.record_folders||[]).some(f=>f.folder_id===filters.folder)) return false;
    if (filters.person && !(r.record_relationships||[]).some(x=>x.relationship_id===filters.person)) return false;
    if (filters.from && r.record_date < filters.from) return false;
    if (filters.to && r.record_date > filters.to) return false;
    if (filters.keyword){
      const hay = ((r.title||"") + " " + r.body).toLowerCase();
      if (!hay.includes(filters.keyword.toLowerCase())) return false;
    }
    return true;
  });
}

function runPickerSearch(sections){
  const section = sections.find(s => s.id === bookPicker.sectionId);
  const already = new Set((section?.book_section_records||[]).map(sr=>sr.record_id));
  const savedRecords = state.records.filter(r => r.status === "saved");
  const filters = currentPickerFilters();
  const results = filterPickerRecords(savedRecords, already, filters);
  lastPickerResultIds = results.map(r => r.id);

  const list = document.getElementById("pickerResults");
  list.innerHTML = `
    ${results.length ? `<div class="row" style="margin-top:0">
      <button class="btn ghost small" id="pickAllBtn">전체선택</button>
      <button class="btn ghost small" id="pickNoneBtn">전체해제</button>
    </div>` : ""}
    ${results.length ? results.map(r => `
    <label style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer">
      <input type="checkbox" data-pickitem="${r.id}" ${bookPicker.selected.has(r.id)?'checked':''} style="width:auto;margin-top:3px">
      <span>
        <span class="tag">${r.kind==='moment'?'오늘의 멈춤':'기록하기'}</span>
        <div style="font-weight:600;margin-top:4px">${r.title || "(제목 없음)"}</div>
        <div class="muted" style="margin-top:2px">${r.body.slice(0,40)}${r.body.length>40?"...":""}</div>
      </span>
    </label>
  `).join("") : `<div class="empty">조건에 맞는 기록이 없습니다.</div>`}
  `;

  list.querySelectorAll("[data-pickitem]").forEach(chk=>{
    chk.onchange = () => {
      if (chk.checked) bookPicker.selected.add(chk.dataset.pickitem);
      else bookPicker.selected.delete(chk.dataset.pickitem);
      updatePickerCount();
    };
  });
  const allBtn = document.getElementById("pickAllBtn");
  if (allBtn) allBtn.onclick = () => {
    lastPickerResultIds.forEach(id => bookPicker.selected.add(id));
    list.querySelectorAll("[data-pickitem]").forEach(chk => chk.checked = true);
    updatePickerCount();
  };
  const noneBtn = document.getElementById("pickNoneBtn");
  if (noneBtn) noneBtn.onclick = () => {
    lastPickerResultIds.forEach(id => bookPicker.selected.delete(id));
    list.querySelectorAll("[data-pickitem]").forEach(chk => chk.checked = false);
    updatePickerCount();
  };
  updatePickerCount();
}

function updatePickerCount(){
  const el = document.getElementById("pickerCount");
  if (el) el.textContent = "선택된 항목: " + bookPicker.selected.size + "개";
}

async function addSelectedToSection(sectionId, sections){
  if (!bookPicker.selected.size) return toast("먼저 기록을 선택해주세요.");
  const section = sections.find(s => s.id === sectionId);
  let count = (section?.book_section_records||[]).length;
  const rows = [...bookPicker.selected].map(recordId => ({ section_id: sectionId, record_id: recordId, sort_order: count++ }));
  const { error } = await sb.from("book_section_records").insert(rows);
  if (error) return toast("추가 실패: " + error.message);
  toast(rows.length + "개를 추가했습니다.");
  bookPicker = { sectionId: null, selected: new Set() };
  renderBookTab();
}

// ---------- 명언 관리 (설정 하위 탭) ----------
const QUOTE_AI_PROMPT = `아래 조건에 맞는 한국어 명언 50개를 CSV로 만들어줘.
- 형식: text,author (첫 줄은 헤더 그대로 포함)
- text 안에 쉼표가 있으면 큰따옴표로 감싸기
- 저자를 모르면 "작자 미상"으로 표기
- 저작권이 소멸된(오래된 속담, 고전, 유명인의 짧은 어록) 문장 위주로
- 한 줄에 하나씩, 총 50줄 (헤더 제외)`;

async function loadQuotes(){
  const { data, error } = await sb.from("quotes").select("*").eq("owner_id", state.user.id).order("created_at", { ascending: false });
  if (error){ toast("불러오기 실패: " + error.message); return; }
  state.quotes = data || [];
}

function parseQuoteCsv(text){
  const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
  const rows = [];
  for (const line of lines){
    // 간단한 CSV 파서: 큰따옴표로 감싼 콤마를 보존
    const matches = line.match(/(".*?"|[^,]+)(?=,|$)/g) || [];
    const cols = matches.map(c => c.trim().replace(/^"|"$/g, "").replace(/""/g, '"'));
    if (cols[0]?.toLowerCase() === "text" && (cols[1]||"").toLowerCase() === "author") continue; // 헤더 skip
    if (cols[0]) rows.push({ text: cols[0], author: cols[1] || null });
  }
  return rows;
}

let openQuoteId = null;
let openQuoteMenu = null;

async function renderQuotesTab(){
  await loadQuotes();
  document.getElementById("settingsBody").innerHTML = `
    <div class="panel">
      <p class="muted">외부 명언 서비스 대신, 원하는 AI로 직접 만든 명언집을 CSV로 업로드해서 씁니다.</p>
      <div class="row" style="margin-top:0">
        <button class="btn ghost small" id="downloadTemplate">업로드 양식 다운로드</button>
        <button class="btn ghost small" id="copyPrompt">AI 프롬프트 복사</button>
        <button class="btn ghost small" id="deleteAllQuotes" style="color:var(--danger)">전체 삭제</button>
      </div>
      <label>CSV 파일 업로드 (text,author)</label>
      <input id="quoteFile" type="file" accept=".csv,text/csv">
      <button class="btn" id="quoteUpload" style="margin-top:10px">업로드</button>
    </div>
    <div class="panel">
      <div class="muted">총 ${state.quotes.length}개 등록됨</div>
      ${state.quotes.map(q => renderQuoteItem(q)).join("") || `<div class="empty">아직 업로드된 명언이 없습니다.</div>`}
    </div>
  `;

  document.getElementById("downloadTemplate").onclick = () => {
    const blob = new Blob(["text,author\n\"오늘 걷지 않으면 내일은 뛰어야 한다\",작자 미상\n"], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "머물다_명언업로드양식.csv"; a.click();
    URL.revokeObjectURL(url);
  };

  document.getElementById("copyPrompt").onclick = async () => {
    await navigator.clipboard?.writeText(QUOTE_AI_PROMPT).catch(()=>{});
    toast("프롬프트를 클립보드에 복사했습니다.");
  };

  document.getElementById("deleteAllQuotes").onclick = async () => {
    if (!state.quotes.length) return toast("삭제할 명언이 없습니다.");
    if (!confirm(`등록된 명언 ${state.quotes.length}개를 모두 삭제하시겠습니까? 되돌릴 수 없습니다.`)) return;
    const { error } = await sb.from("quotes").delete().eq("owner_id", state.user.id);
    if (error) return toast("삭제 실패: " + error.message);
    toast("전체 삭제했습니다.");
    renderQuotesTab();
  };

  document.getElementById("quoteUpload").onclick = async () => {
    const file = document.getElementById("quoteFile").files[0];
    if (!file) return toast("파일을 선택해주세요.");
    const text = await file.text();
    const rows = parseQuoteCsv(text);
    if (!rows.length) return toast("업로드할 내용이 없습니다. 양식을 확인해주세요.");
    const { error } = await sb.from("quotes").insert(rows.map(r => ({ owner_id: state.user.id, text: r.text, author: r.author })));
    if (error) return toast("업로드 실패: " + error.message);
    toast(rows.length + "개 업로드했습니다.");
    renderQuotesTab();
  };

  document.querySelectorAll("[data-quotemenu]").forEach(btn=>{
    btn.onclick = () => { openQuoteMenu = (openQuoteMenu === btn.dataset.quotemenu) ? null : btn.dataset.quotemenu; renderQuotesTab(); };
  });
  document.querySelectorAll("[data-editquote]").forEach(btn=>{
    btn.onclick = () => { openQuoteId = (openQuoteId === btn.dataset.editquote) ? null : btn.dataset.editquote; openQuoteMenu = null; renderQuotesTab(); };
  });
  document.querySelectorAll("[data-savequote]").forEach(btn=>{
    btn.onclick = async () => {
      const text = document.getElementById("editQuoteText-" + btn.dataset.savequote).value.trim();
      const author = document.getElementById("editQuoteAuthor-" + btn.dataset.savequote).value.trim() || null;
      if (!text) return toast("내용을 입력해주세요.");
      const { error } = await sb.from("quotes").update({ text, author }).eq("id", btn.dataset.savequote);
      if (error) return toast("수정 실패: " + error.message);
      toast("수정했습니다.");
      openQuoteId = null;
      renderQuotesTab();
    };
  });
  document.querySelectorAll("[data-delquote]").forEach(btn=>{
    btn.onclick = async () => {
      if (!confirm("이 명언을 삭제하시겠습니까?")) return;
      const { error } = await sb.from("quotes").delete().eq("id", btn.dataset.delquote);
      if (error) return toast("삭제 실패: " + error.message);
      openQuoteMenu = null;
      renderQuotesTab();
    };
  });
}

function renderQuoteItem(q){
  if (openQuoteId === q.id){
    return `
      <div class="record">
        <label>내용</label>
        <textarea id="editQuoteText-${q.id}" style="min-height:60px">${q.text}</textarea>
        <label>저자</label>
        <input id="editQuoteAuthor-${q.id}" value="${(q.author||"").replace(/"/g,'&quot;')}">
        <div class="row">
          <button class="btn small" data-savequote="${q.id}">저장</button>
          <button class="btn ghost small" data-editquote="${q.id}">취소</button>
          <button class="actionlink danger" data-delquote="${q.id}">삭제</button>
        </div>
      </div>
    `;
  }
  return `
    <div class="record">
      <div class="cardhead">
        <div>
          <div>${q.text}</div>
          <div class="muted" style="margin-top:2px">— ${q.author || "작자 미상"}</div>
        </div>
        <div style="white-space:nowrap;position:relative">
          <button class="iconbtn" data-quotemenu="${q.id}">⋮</button>
          ${openQuoteMenu === q.id ? `
            <div style="position:absolute;right:0;top:28px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:5">
              <button class="actionlink" data-editquote="${q.id}" style="display:block;width:100%;text-align:left">변경</button>
              <button class="actionlink danger" data-delquote="${q.id}" style="display:block;width:100%;text-align:left">삭제</button>
            </div>
          ` : ""}
        </div>
      </div>
    </div>
  `;
}

      <div class="record">
        <div class="muted">앱 이름</div>
        <div style="font-weight:600">머물다</div>
